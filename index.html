<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💒 柴火鸡邀请函</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #0a0a0a;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,0,128,.45), transparent 42%),
      radial-gradient(circle at 85% 85%, rgba(255,200,0,.42), transparent 42%),
      radial-gradient(circle at 50% 50%, #1a0b1a 0%, #000 100%);
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'PingFang SC', 'Microsoft YaHei', cursive, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 16px 90px;
    color: #fff;
    position: relative;
  }

  /* ===== 抽象浮动背景 ===== */
  .abstract-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .abstract-text {
    position: absolute;
    font-size: 22px;
    font-weight: bold;
    color: rgba(255,255,255,.13);
    white-space: nowrap;
    animation: floatRandom 10s linear infinite;
    text-shadow: 0 0 10px #ff00cc;
  }
  @keyframes floatRandom {
    0%   { transform: translateY(110vh) rotate(0deg) scale(.5); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: .8; }
    100% { transform: translateY(-20vh) rotate(360deg) scale(1.5); opacity: 0; }
  }

  /* ===== 主卡片 ===== */
  .card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 380px;
    background: rgba(20,5,15,.86);
    border: 4px dashed #ffcc00;
    border-radius: 30px 10px 40px 15px;
    padding: 24px 18px 26px;
    text-align: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow:
      0 0 20px rgba(255,0,128,.6),
      inset 0 0 30px rgba(255,200,0,.2);
    animation: cardWobble 4s ease-in-out infinite alternate;
  }
  @keyframes cardWobble {
    0%   { transform: rotate(-1.5deg) scale(1);    border-color: #ffcc00; }
    50%  { transform: rotate(1.5deg)  scale(1.02); border-color: #ff00cc; }
    100% { transform: rotate(-1deg)   scale(.98);  border-color: #00ffff; }
  }

  /* ===== 比心图片 ===== */
  .img-box {
    position: relative;
    width: 150px;
    height: 150px;
    margin: 0 auto 16px;
    border-radius: 50%;
    overflow: hidden;
    border: 5px solid #ff00cc;
    box-shadow: 0 0 25px #ff00cc, inset 0 0 20px #000;
    animation: imgSpin 6s linear infinite;
    mix-blend-mode: screen;
    background: #111;
  }
  .img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: contrast(1.2) saturate(1.5) drop-shadow(0 0 5px #fff);
  }
  @keyframes imgSpin {
    0%   { transform: rotate(0deg)   scale(1); }
    50%  { transform: rotate(180deg) scale(1.15); }
    100% { transform: rotate(360deg) scale(1); }
  }

  /* ===== 标题 ===== */
  .title-1 {
    font-size: 22px;
    color: #ffcc00;
    text-shadow: 2px 2px 0 #ff00cc, -2px -2px 0 #00ffff;
    margin-bottom: 8px;
    animation: glitchText .5s infinite alternate;
  }
  @keyframes glitchText {
    0%   { transform: translate(0); }
    100% { transform: translate(-2px, 2px); }
  }

  .title-2 {
    font-size: 13px;
    color: #00ffff;
    letter-spacing: 2px;
    margin-bottom: 14px;
    font-style: italic;
    text-shadow: 0 0 10px #00ffff;
  }

  .highlight {
    font-size: 24px;
    font-weight: 900;
    background: linear-gradient(90deg, #ff00cc, #ffcc00, #00ffff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 14px 0;
    animation: hueRotate 3s linear infinite;
  }
  @keyframes hueRotate {
    0%   { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  .verse {
    font-size: 15px;
    color: #e0e0e0;
    line-height: 1.7;
    margin: 8px 0;
    transform: skewX(-5deg);
  }
  .verse.strong {
    font-weight: bold;
    color: #ffcc00;
    text-shadow: 0 0 8px rgba(255,204,0,.6);
  }

  /* ===== 时间地点 ===== */
  .info-box {
    margin-top: 14px;
    padding: 10px 12px;
    background: rgba(255,255,255,.05);
    border-left: 5px solid #ff00cc;
    border-right: 5px solid #ffcc00;
    border-radius: 5px;
    text-align: left;
    transform: rotate(1deg);
  }
  .info-box p {
    font-size: 14px;
    margin: 6px 0;
    color: #fff;
    line-height: 1.5;
  }
  .info-box span {
    color: #ffcc00;
    font-weight: bold;
    text-shadow: 0 0 8px #ffcc00;
  }

  /* ===== 按钮区 ===== */
  .btn-group {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  .btn {
    flex: 1;
    padding: 13px 6px;
    font-size: 16px;
    font-weight: 800;
    font-family: inherit;
    letter-spacing: 2px;
    color: #fff;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform .15s ease;
    text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  .btn:active { transform: scale(.94); }

  .btn-accept {
    background: linear-gradient(135deg, #ff0080, #ff4d4d);
    box-shadow: 0 0 20px rgba(255,0,128,.7), inset 0 -3px 0 rgba(0,0,0,.25);
    animation: pulseGlow 1.6s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 16px rgba(255,0,128,.6), inset 0 -3px 0 rgba(0,0,0,.25); }
    50%      { box-shadow: 0 0 30px rgba(255,0,128,1),  inset 0 -3px 0 rgba(0,0,0,.25); }
  }

  .btn-agree {
    background: linear-gradient(135deg, #ffcc00, #ff8800);
    box-shadow: 0 0 20px rgba(255,200,0,.7), inset 0 -3px 0 rgba(0,0,0,.25);
    animation: pulseGlow2 1.6s ease-in-out infinite;
  }
  @keyframes pulseGlow2 {
    0%, 100% { box-shadow: 0 0 16px rgba(255,200,0,.6), inset 0 -3px 0 rgba(0,0,0,.25); }
    50%      { box-shadow: 0 0 30px rgba(255,200,0,1),  inset 0 -3px 0 rgba(0,0,0,.25); }
  }

  /* 按钮上的小闪光 */
  .btn::after {
    content: '';
    position: absolute;
    top: 0; left: -75%;
    width: 50%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.55), transparent);
    transform: skewX(-20deg);
    animation: shine 2.6s infinite;
  }
  @keyframes shine {
    0%   { left: -75%; }
    60%  { left: 130%; }
    100% { left: 130%; }
  }

  /* ===== 音乐提示 ===== */
  .music-tip {
    font-size: 12px;
    color: #888;
    margin-top: 16px;
    animation: blink 1.5s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: .3; }
    50%      { opacity: 1; }
  }

  /* ===== 弹窗 ===== */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,.88);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: opacity .35s ease, visibility .35s;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .overlay.show {
    opacity: 1;
    visibility: visible;
  }

  .popup {
    position: relative;
    width: 100%;
    max-width: 340px;
    background: linear-gradient(160deg, #2a0a20, #150310);
    border: 3px solid #ffcc00;
    border-radius: 24px;
    padding: 20px 16px 18px;
    text-align: center;
    box-shadow: 0 0 40px rgba(255,0,128,.8);
    transform: scale(.7) rotate(-6deg);
    transition: transform .4s cubic-bezier(.2,.9,.3,1.5);
  }
  .overlay.show .popup {
    transform: scale(1) rotate(0deg);
  }

  .popup-title {
    font-size: 20px;
    font-weight: 900;
    color: #ffcc00;
    text-shadow: 0 0 12px #ff00cc, 2px 2px 0 #ff00cc;
    margin-bottom: 12px;
    animation: glitchText .5s infinite alternate;
  }

  .popup-img {
    width: 100%;
    border-radius: 14px;
    display: block;
    border: 2px solid rgba(255,204,0,.6);
    box-shadow: 0 0 20px rgba(255,0,128,.6);
  }

  .popup-text {
    font-size: 14px;
    color: #ffe0b3;
    margin-top: 12px;
    line-height: 1.6;
    letter-spacing: .5px;
  }

  .popup-close {
    margin-top: 16px;
    padding: 10px 30px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    letter-spacing: 2px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff0080, #ff8800);
    box-shadow: 0 0 18px rgba(255,0,128,.8);
    cursor: pointer;
    transition: transform .15s ease;
  }
  .popup-close:active { transform: scale(.92); }

  /* ===== 点击撒花 ===== */
  .click-emoji {
    position: fixed;
    pointer-events: none;
    font-size: 30px;
    z-index: 2000;
    animation: popOut .8s ease-out forwards;
  }
  @keyframes popOut {
    0%   { transform: translate(-50%,-50%) scale(0) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%,-180%) scale(1.5) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>

<!-- ================= 背景音乐 ================= -->
<audio id="bgm" loop preload="auto">
  <source src="bgm.mp3" type="audio/mpeg">
</audio>

<!-- 抽象浮动背景 -->
<div class="abstract-bg" id="abstractBg"></div>

<!-- 主卡片 -->
<main class="card">
  <div class="title-1">💒 邀请函 💒</div>
  <div class="title-2">囍.Let's to eat chaihuoji.囍</div>

  <!-- 比心表情包：src 改成你自己的图片名 -->
  <div class="img-box">
    <img src="bixin.png" alt="抽象比心"
         onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🫰</text></svg>';">
  </div>

  <div class="highlight">💞~我们吃柴火鸡啦~💞</div>

  <div class="verse">🎉喜相逢佳期已定</div>
  <div class="verse">敬备柴火鸡喜筵</div>
  <div class="verse strong">诚邀您一同共进晚餐🍻</div>

  <div class="info-box">
    <p>⏰ 时间：<span>下周六 17:30 - 20:00</span></p>
    <p>📍 地址：<span>金堂山柴火鸡旗舰店</span></p>
  </div>

  <!-- 接受 / 同意 按钮 -->
  <div class="btn-group">
    <button class="btn btn-accept" type="button" data-type="accept">接受</button>
    <button class="btn btn-agree"  type="button" data-type="agree">同意</button>
  </div>

  <div class="music-tip">👆 点击屏幕任意位置开启背景音乐</div>
</main>

<!-- ================= 弹窗 ================= -->
<div class="overlay" id="overlay">
  <div class="popup">
    <div class="popup-title" id="popupTitle">🎉 收到！</div>

    <!-- 弹窗图片：src 改成你自己的图片名 -->
    <img class="popup-img" id="popupImg" src="bixin.png" alt="确认图片"
         onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 200%22><rect width=%22300%22 height=%22200%22 fill=%22%23331122%22/><text x=%22150%22 y=%22115%22 font-size=%2260%22 text-anchor=%22middle%22>🫰</text></svg>';">

    <div class="popup-text" id="popupText">期待与你一起吃柴火鸡！</div>
    <button class="popup-close" type="button" id="popupClose">关闭</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ========== 1. 抽象背景 ========== */
  var bg = document.getElementById('abstractBg');
  var words = ['柴火鸡', '抽象', '囍', '🔥', '🍗', '💞', '🎉', '吃鸡'];
  for (var i = 0; i < 20; i++) {
    var el = document.createElement('div');
    el.className = 'abstract-text';
    el.innerText = words[Math.floor(Math.random() * words.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (6 + Math.random() * 8) + 's';
    el.style.animationDelay = (Math.random() * 5) + 's';
    bg.appendChild(el);
  }

  /* ========== 2. 背景音乐 ========== */
  var audio = document.getElementById('bgm');
  var isPlaying = false;

  function playMusic() {
    if (isPlaying) return;
    audio.play().then(function () {
      isPlaying = true;
      var tip = document.querySelector('.music-tip');
      if (tip) tip.style.display = 'none';
    }).catch(function (err) {
      console.log('音乐播放失败：', err);
    });
  }

  /* ========== 3. 点击撒花 ========== */
  function burstEmoji(x, y) {
    var emojis = ['🔥', '🍗', '💖', '🎉', '💒', '🫰'];
    for (var i = 0; i < 5; i++) {
      var span = document.createElement('span');
      span.className = 'click-emoji';
      span.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      span.style.left = x + 'px';
      span.style.top = y + 'px';
      span.style.animationDelay = (Math.random() * 0.2) + 's';
      document.body.appendChild(span);
      (function (node) {
        setTimeout(function () { node.remove(); }, 1000);
      })(span);
    }
  }

  document.addEventListener('click', function (e) {
    playMusic();
    if (e.target.closest('.btn') || e.target.closest('.popup-close')) return;
    burstEmoji(e.clientX, e.clientY);
  });

  document.addEventListener('touchstart', function () {
    playMusic();
  }, { once: true });

  /* ========== 4. 弹窗逻辑 ========== */
  var overlay     = document.getElementById('overlay');
  var popupTitle  = document.getElementById('popupTitle');
  var popupText   = document.getElementById('popupText');
  var popupClose  = document.getElementById('popupClose');

  var CONTENT = {
    accept: {
      title: '🎉 收到！',
      text: '期待与你一起吃柴火鸡！<br>不见不散哦～'
    },
    agree: {
      title: '💖 同意！',
      text: '柴火鸡之约已生效！<br>下周六金堂山见～'
    }
  };

  function openPopup(type) {
    var data = CONTENT[type] || CONTENT.accept;
    popupTitle.innerText = data.title;
    popupText.innerHTML = data.text;
    overlay.classList.add('show');
    playMusic();

    // 弹窗打开时，中间炸一波表情
    var cx = window.innerWidth / 2;
    var cy = window.innerHeight / 2;
    burstEmoji(cx, cy);
  }

  function closePopup() {
    overlay.classList.remove('show');
  }

  document.querySelectorAll('.btn').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      openPopup(btn.getAttribute('data-type'));
    });
  });

  popupClose.addEventListener('click', function (e) {
    e.stopPropagation();
    closePopup();
  });

  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closePopup();
  });

})();
</script>
</body>
</html>
