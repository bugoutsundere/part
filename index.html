<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>💒 邀请函 · 我们吃柴火鸡啦</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100dvh;
    background: radial-gradient(ellipse 80% 60% at 50% 15%, #651032 0%, #34061a 42%, #15030c 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: grid;
    place-items: center;
    padding: 54px 16px 80px;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== 背景飘浮元素 ===== */
  #bgLayer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .bg-item {
    position: absolute;
    bottom: -50px;
    animation-name: rise;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    will-change: transform, opacity;
  }
  @keyframes rise {
    0%   { transform: translateY(0) rotate(0deg) scale(.8); opacity: 0; }
    12%  { opacity: .7; }
    85%  { opacity: .45; }
    100% { transform: translateY(-115vh) rotate(320deg) scale(1.15); opacity: 0; }
  }

  /* ===== 卡片 ===== */
  .card {
    position: relative;
    z-index: 2;
    width: min(100%, 400px);
    padding: 26px 20px 24px;
    border-radius: 26px;
    text-align: center;
    background: linear-gradient(160deg, rgba(104,18,52,.94) 0%, rgba(52,6,26,.97) 55%, rgba(30,3,15,.98) 100%);
    border: 1px solid rgba(255,207,112,.45);
    box-shadow:
      inset 0 0 0 1px rgba(255,95,126,.12),
      0 0 34px rgba(255,70,120,.30),
      0 0 90px rgba(255,120,40,.12),
      0 22px 50px rgba(0,0,0,.65);
    animation: cardIn .95s cubic-bezier(.18,.89,.32,1.28) both;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    background: radial-gradient(circle at 50% -10%, rgba(255,120,160,.30), transparent 55%);
    pointer-events: none;
  }
  .card::after {
    content: '✦';
    position: absolute;
    top: 13px; left: 16px;
    font-size: 13px;
    color: rgba(255,207,112,.85);
    text-shadow: 0 0 10px rgba(255,207,112,.9);
    animation: twinkle 2.2s ease-in-out infinite;
    z-index: 1;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .35; transform: scale(.85) rotate(0deg); }
    50%      { opacity: 1;   transform: scale(1.15) rotate(35deg); }
  }
  .card > * { position: relative; z-index: 1; }

  /* ===== 出场动画 ===== */
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(28px) scale(.9); }
    to   { opacity: 1; transform: none; }
  }
  .reveal {
    opacity: 0;
    animation: fadeUp .85s cubic-bezier(.2,.85,.3,1) forwards;
    animation-delay: var(--d, 0s);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  /* ===== 顶部标签 ===== */
  .ribbon {
    display: inline-block;
    font-size: 14px;
    letter-spacing: 3px;
    text-indent: 3px;
    padding: 6px 18px;
    border-radius: 999px;
    color: #ffe8bd;
    background: linear-gradient(90deg, rgba(255,95,126,.24), rgba(255,207,112,.24));
    border: 1px solid rgba(255,207,112,.5);
    box-shadow: 0 0 16px rgba(255,207,112,.28), inset 0 0 12px rgba(255,207,112,.10);
  }

  /* ===== 比心主角 ===== */
  .bixin {
    position: relative;
    height: 132px;
    display: grid;
    place-items: center;
    margin: 4px 0 6px;
  }
  .halo {
    position: absolute;
    width: 118px; height: 118px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,90,130,.55), rgba(255,60,110,.12) 55%, transparent 72%);
    animation: haloPulse 1.15s ease-in-out infinite;
  }
  @keyframes haloPulse {
    0%, 100% { transform: scale(.86); opacity: .75; }
    50%      { transform: scale(1.12); opacity: 1; }
  }
  .hand-wrap { animation: popIn .85s .65s cubic-bezier(.2,.9,.3,1.6) both; }
  @keyframes popIn {
    from { transform: scale(0) rotate(-45deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .hand {
    display: block;
    font-size: 74px;
    line-height: 1;
    animation: beat 1.15s ease-in-out infinite;
    filter: drop-shadow(0 0 12px rgba(255,95,126,.95)) drop-shadow(0 0 28px rgba(255,60,110,.55));
  }
  @keyframes beat {
    0%, 100% { transform: scale(1) rotate(-5deg); }
    50%      { transform: scale(1.14) rotate(-5deg); }
  }

  /* 从比心里飞出的心心 */
  .mh {
    position: absolute;
    bottom: 48px;
    left: calc(50% + var(--x));
    font-size: 15px;
    opacity: 0;
    pointer-events: none;
    animation: floatUp 2.4s ease-out infinite;
    animation-delay: var(--dl);
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(.3); }
    25%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -95px) scale(1.15); }
  }

  /* ===== 文案 ===== */
  .shaokao {
    font-size: 12.5px;
    letter-spacing: 1.6px;
    font-style: italic;
    color: #ffb3c6;
    margin: 2px 0 8px;
    text-shadow: 0 0 10px rgba(255,95,126,.6);
  }

  .main-title {
    margin: 6px 0 2px;
    font-size: clamp(25px, 7.4vw, 32px);
    font-weight: 800;
    letter-spacing: 1px;
    line-height: 1.3;
  }
  .grad {
    background: linear-gradient(180deg, #fff8e3 0%, #ffd579 45%, #ff9b34 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 10px rgba(255,150,50,.6));
  }
  .flame {
    display: inline-block;
    margin: 0 4px;
    animation: bounce 1.6s ease-in-out infinite;
  }
  .flame:last-child { animation-delay: .3s; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50%      { transform: translateY(-5px) rotate(6deg); }
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 14px 0 12px;
    color: #ffcf70;
    font-size: 11px;
    text-shadow: 0 0 10px rgba(255,207,112,.85);
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,207,112,.75), transparent);
  }

  .verse {
    margin: 7px 0;
    font-size: 15px;
    color: #ffe1c4;
    letter-spacing: 1.5px;
    line-height: 1.6;
  }
  .verse.strong { color: #ffd6a3; font-weight: 600; }

  /* ===== 时间地点 ===== */
  .info {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding: 11px 12px;
    border-radius: 15px;
    text-align: left;
    background: linear-gradient(90deg, rgba(255,95,126,.14), rgba(255,207,112,.10));
    border: 1px solid rgba(255,207,112,.28);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 4px 14px rgba(0,0,0,.25);
  }
  .info .ico { font-size: 17px; flex: none; filter: drop-shadow(0 0 6px rgba(255,160,90,.85)); }
  .info .label {
    flex: none;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    color: #ffe4b8;
    letter-spacing: 1px;
    background: rgba(255,120,80,.28);
    border: 1px solid rgba(255,207,112,.35);
  }
  .info .val {
    font-size: clamp(13px, 3.7vw, 14.5px);
    font-weight: 700;
    color: #fff3dd;
    letter-spacing: .5px;
    text-shadow: 0 0 12px rgba(255,180,90,.5);
  }

  .footer {
    margin-top: 18px;
    font-size: 13px;
    letter-spacing: 3px;
    text-indent: 3px;
    color: #ffb9c9;
    text-shadow: 0 0 12px rgba(255,95,126,.75);
  }

  /* ===== 重播按钮 ===== */
  .replay {
    position: fixed;
    left: 50%;
    bottom: max(20px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 20;
    padding: 9px 22px;
    border-radius: 999px;
    font-size: 13px;
    font-family: inherit;
    letter-spacing: 1px;
    color: #ffe6bb;
    background: rgba(60,8,28,.78);
    border: 1px solid rgba(255,207,112,.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 0 18px rgba(255,95,126,.32);
    cursor: pointer;
    animation: fadeIn 1s 3.6s both;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .replay:active { transform: translateX(-50%) scale(.93); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ===== 点击撒花 ===== */
  .burst {
    position: fixed;
    z-index: 999;
    pointer-events: none;
    line-height: 1;
    animation: burstOut .95s cubic-bezier(.15,.7,.4,1) forwards;
  }
  @keyframes burstOut {
    0%   { opacity: 1; transform: translate(-50%,-50%) scale(.3) rotate(0deg); }
    60%  { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.15) rotate(200deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-delay: 0s !important;
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>

<div id="bgLayer"></div>

<main class="card">
  <div class="ribbon reveal" style="--d:.35s">💒 邀请函 💒</div>

  <div class="bixin">
    <div class="halo"></div>
    <div class="hand-wrap"><span class="hand">🫰</span></div>
    <span class="mh" style="--x:-32px; --dl:0s">❤️</span>
    <span class="mh" style="--x:26px;  --dl:.8s">💖</span>
    <span class="mh" style="--x:0px;   --dl:1.6s">💕</span>
  </div>

  <div class="shaokao reveal" style="--d:1.05s">囍 · Let's to eat shaokao · 囍</div>

  <h1 class="main-title reveal" style="--d:1.3s">
    <span class="flame">🔥</span><span class="grad">我们吃柴火鸡啦</span><span class="flame">🍗</span>
  </h1>

  <div class="divider reveal" style="--d:1.6s">❤</div>

  <p class="verse reveal" style="--d:1.8s">喜相逢，佳期已定</p>
  <p class="verse reveal" style="--d:2.0s">敬备柴火鸡喜筵</p>
  <p class="verse strong reveal" style="--d:2.2s">诚邀您一同共进晚餐 🍻</p>

  <div class="info reveal" style="--d:2.5s">
    <span class="ico">🕠</span>
    <span class="label">时间</span>
    <span class="val">下周六 17:30 - 20:00</span>
  </div>

  <div class="info reveal" style="--d:2.8s">
    <span class="ico">📍</span>
    <span class="label">地址</span>
    <span class="val">金堂山柴火鸡旗舰店</span>
  </div>

  <div class="footer reveal" style="--d:3.15s">恭候光临 · 不见不散</div>
</main>

<button class="replay" type="button">🔁 再看一次</button>

<script>
(function () {
  'use strict';

  /* ---------- 背景飘浮 ---------- */
  var bgLayer = document.getElementById('bgLayer');
  var SYMBOLS = ['❤️', '💖', '💗', '💕', '✨', '🔥', '🍗', '🌸'];

  function spawnBgItem() {
    var el = document.createElement('span');
    el.className = 'bg-item';
    el.textContent = SYMBOLS[(Math.random() * SYMBOLS.length) | 0];
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.fontSize = (10 + Math.random() * 16) + 'px';

    var dur = 9 + Math.random() * 8;
    el.style.animationDuration = dur + 's';

    bgLayer.appendChild(el);
    window.setTimeout(function () { el.remove(); }, dur * 1000 + 400);
  }

  for (var i = 0; i < 14; i++) {
    window.setTimeout(spawnBgItem, i * 220);
  }
  window.setInterval(spawnBgItem, 520);

  /* ---------- 点击撒花 ---------- */
  var BURST = ['❤️', '💖', '💕', '✨', '🔥', '💫'];

  function burst(x, y) {
    for (var i = 0; i < 9; i++) {
      var el = document.createElement('span');
      el.className = 'burst';
      el.textContent = BURST[(Math.random() * BURST.length) | 0];
      el.style.left = x + 'px';
      el.style.top = y + 'px';

      var ang = Math.random() * Math.PI * 2;
      var dist = 45 + Math.random() * 85;
      el.style.setProperty('--tx', Math.cos(ang) * dist + 'px');
      el.style.setProperty('--ty', Math.sin(ang) * dist + 'px');
      el.style.fontSize = (12 + Math.random() * 14) + 'px';
      el.style.animationDelay = (Math.random() * 0.08) + 's';

      document.body.appendChild(el);
      (function (node) {
        window.setTimeout(function () { node.remove(); }, 1200);
      })(el);
    }
  }

  document.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.replay')) return;
    burst(e.clientX, e.clientY);
  });

  /* ---------- 重播 ---------- */
  var replayBtn = document.querySelector('.replay');
  replayBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var card = document.querySelector('.card');
    var clone = card.cloneNode(true);
    card.replaceWith(clone);
  });
})();
</script>
</body>
</html>
