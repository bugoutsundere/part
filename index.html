<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💒 抽象柴火鸡邀请函</title>
<style>
  /* 抽象派基础设定 */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100dvh;
    background: #0a0a0a;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(255,0,128,0.4), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(255,200,0,0.4), transparent 40%),
      radial-gradient(circle at 50% 50%, #1a0b1a 0%, #000 100%);
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'PingFang SC', 'Microsoft YaHei', cursive, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    color: #fff;
  }

  /* 抽象浮动背景 */
  .abstract-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .abstract-text {
    position: absolute;
    font-size: 24px;
    font-weight: bold;
    color: rgba(255, 255, 255, 0.15);
    white-space: nowrap;
    animation: floatRandom 10s linear infinite;
    text-shadow: 0 0 10px #ff00cc;
  }
  @keyframes floatRandom {
    0% { transform: translateY(110vh) rotate(0deg) scale(0.5); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.8; }
    100% { transform: translateY(-20vh) rotate(360deg) scale(1.5); opacity: 0; }
  }

  /* 主卡片 - 抽象扭曲感 */
  .card {
    position: relative;
    z-index: 10;
    width: 90%;
    max-width: 380px;
    background: rgba(20, 5, 15, 0.85);
    border: 4px dashed #ffcc00;
    border-radius: 30px 10px 40px 15px;
    padding: 25px 18px;
    text-align: center;
    backdrop-filter: blur(12px);
    box-shadow: 
      0 0 20px rgba(255, 0, 128, 0.6),
      inset 0 0 30px rgba(255, 200, 0, 0.2);
    animation: cardWobble 4s ease-in-out infinite alternate;
  }
  @keyframes cardWobble {
    0% { transform: rotate(-1.5deg) scale(1); border-color: #ffcc00; }
    50% { transform: rotate(1.5deg) scale(1.02); border-color: #ff00cc; }
    100% { transform: rotate(-1deg) scale(0.98); border-color: #00ffff; }
  }

  /* 图片无缝融入 */
  .img-box {
    position: relative;
    width: 150px;
    height: 150px;
    margin: 0 auto 15px;
    border-radius: 50%;
    overflow: hidden;
    border: 5px solid #ff00cc;
    box-shadow: 0 0 25px #ff00cc, inset 0 0 20px #000;
    animation: imgSpin 6s linear infinite;
    mix-blend-mode: screen; /* 让背景和图片产生奇妙融合 */
  }
  .img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: contrast(1.2) saturate(1.5) drop-shadow(0 0 5px #fff);
  }
  @keyframes imgSpin {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.15); }
    100% { transform: rotate(360deg) scale(1); }
  }

  /* 抽象文字排版 */
  .title-1 {
    font-size: 22px;
    color: #ffcc00;
    text-shadow: 2px 2px 0 #ff00cc, -2px -2px 0 #00ffff;
    margin-bottom: 8px;
    animation: glitchText 0.5s infinite alternate;
  }
  @keyframes glitchText {
    0% { transform: translate(0); }
    100% { transform: translate(-2px, 2px); }
  }

  .title-2 {
    font-size: 14px;
    color: #00ffff;
    letter-spacing: 2px;
    margin-bottom: 15px;
    font-style: italic;
    text-shadow: 0 0 10px #00ffff;
  }

  .highlight {
    font-size: 26px;
    font-weight: 900;
    color: #fff;
    background: linear-gradient(90deg, #ff00cc, #ffcc00, #00ffff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 15px 0;
    animation: hueRotate 3s linear infinite;
  }
  @keyframes hueRotate {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  .verse {
    font-size: 15px;
    color: #e0e0e0;
    line-height: 1.6;
    margin: 10px 0;
    transform: skewX(-5deg);
  }

  .info-box {
    margin-top: 15px;
    padding: 10px;
    background: rgba(255, 255, 255, 0.05);
    border-left: 5px solid #ff00cc;
    border-right: 5px solid #ffcc00;
    border-radius: 5px;
    text-align: left;
    transform: rotate(1deg);
  }
  .info-box p {
    font-size: 14px;
    margin: 5px 0;
    color: #fff;
  }
  .info-box span {
    color: #ffcc00;
    font-weight: bold;
    text-shadow: 0 0 8px #ffcc00;
  }

  /* 音乐提示 */
  .music-tip {
    font-size: 12px;
    color: #888;
    margin-top: 15px;
    animation: blink 1.5s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  /* 抽象点击特效 */
  .click-emoji {
    position: fixed;
    pointer-events: none;
    font-size: 30px;
    z-index: 999;
    animation: popOut 0.8s ease-out forwards;
  }
  @keyframes popOut {
    0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -150%) scale(1.5) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>

<!-- 背景音乐，需要用户点击后播放（浏览器限制） -->
<audio id="bgm" loop>
  <source src="bgm.mp3" type="audio/mpeg">
  你的浏览器不支持音频播放。
</audio>

<!-- 抽象浮动背景层 -->
<div class="abstract-bg" id="abstractBg"></div>

<main class="card">
  <div class="title-1">💒 邀请函 💒</div>
  <div class="title-2">囍.Let's to eat chaihuoji.囍</div>

  <!-- 你的表情包无缝融入 -->
  <div class="img-box">
    <img src="bixin.png" alt="抽象比心" onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=abstract&backgroundColor=ff00cc'">
  </div>

  <div class="highlight">💞~我们吃柴火鸡啦~💞</div>

  <div class="verse">🎉喜相逢佳期已定</div>
  <div class="verse">敬备柴火鸡喜筵</div>
  <div class="verse" style="font-weight:bold; color:#ffcc00;">诚邀您一同共进晚餐🍻</div>

  <div class="info-box">
    <p>⏰ 时间：<span>下周六 17:30 - 20:00</span></p>
    <p>📍 地址：<span>金堂山柴火鸡旗舰店</span></p>
  </div>

  <div class="music-tip">👆 点击屏幕任意位置开启背景音乐</div>
</main>

<script>
  // 1. 抽象背景生成器
  const bg = document.getElementById('abstractBg');
  const words = ['柴火鸡', '抽象', '囍', '🔥', '🍗', '💞', '🎉', '吃鸡'];
  for (let i = 0; i < 20; i++) {
    const el = document.createElement('div');
    el.className = 'abstract-text';
    el.innerText = words[Math.floor(Math.random() * words.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (6 + Math.random() * 8) + 's';
    el.style.animationDelay = (Math.random() * 5) + 's';
    bg.appendChild(el);
  }

  // 2. 背景音乐控制（绕过浏览器自动播放限制）
  const audio = document.getElementById('bgm');
  let isPlaying = false;

  function playMusic() {
    if (!isPlaying) {
      audio.play().then(() => {
        isPlaying = true;
        document.querySelector('.music-tip').style.display = 'none';
      }).catch(e => {
        console.log("播放失败，用户可能还没有交互", e);
      });
    }
  }

  // 点击任意位置播放音乐 + 撒出抽象表情
  document.addEventListener('click', (e) => {
    playMusic();
    
    // 撒出抽象表情
    const emojis = ['🔥', '🍗', '💖', '🎉', '💒', '🫰'];
    for (let i = 0; i < 5; i++) {
      const span = document.createElement('span');
      span.className = 'click-emoji';
      span.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      span.style.left = e.clientX + 'px';
      span.style.top = e.clientY + 'px';
      span.style.animationDelay = (Math.random() * 0.2) + 's';
      document.body.appendChild(span);
      
      setTimeout(() => span.remove(), 1000);
    }
  }, { once: false });

  // 3. 触屏滑动时也触发（移动端）
  document.addEventListener('touchstart', playMusic, { once: true });
</script>
</body>
</html>
