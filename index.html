<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吃柴火鸡邀请函</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #ffe6e6, #ffcccc, #ffb3b3);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 表情包动画 */
        .meme-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ff4d4d;
            animation: heartbeat 1.5s infinite;
            object-fit: cover;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }

        .title {
            color: #d32f2f;
            font-size: 22px;
            font-weight: bold;
            margin: 15px 0 10px;
            letter-spacing: 2px;
        }

        .content {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .highlight {
            color: #d32f2f;
            font-weight: bold;
        }

        .btn-group {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 77, 77, 0.3);
        }

        .btn-accept {
            background: #ff4d4d;
            color: white;
        }

        .btn-agree {
            background: #ffb366;
            color: white;
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 77, 77, 0.5);
        }

        /* 弹出层 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 15px;
            max-width: 90%;
            text-align: center;
            position: relative;
            animation: popIn 0.4s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-content img {
            max-width: 100%;
            border-radius: 10px;
        }

        .close-btn {
            margin-top: 15px;
            padding: 8px 20px;
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 雪花/爱心飘落背景 */
        .snowflake {
            position: absolute;
            color: #ff9999;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 飘落爱心背景 -->
    <div id="snow-container"></div>

    <!-- 邀请函主卡片 -->
    <div class="card">
        <!-- 将 src 替换为你自己的图片路径或链接 -->
        <img src="/bixin.png" alt="比心表情包" class="meme-img">
        
        <div class="title">💒 邀请函 💒</div>
        <div class="title" style="font-size: 18px;">囍. Let's to eat chaihuoji. 囍</div>
        
        <div class="content">
            💞 ~我们吃柴火鸡啦~ 💞<br><br>
            🎉 喜相逢佳期已定，敬备柴火鸡喜筵，<br>
            诚邀您一同共进晚餐 🍻<br><br>
            🕒 时间：<span class="highlight">下周六 17:30-20:00</span><br>
            📍 地址：<span class="highlight">金堂山柴火鸡旗舰店</span>
        </div>

        <div class="btn-group">
            <button class="btn btn-accept" onclick="showLink()">接受</button>
            <button class="btn btn-agree" onclick="showLink()">同意</button>
        </div>
    </div>

    <!-- 弹窗 -->
    <div class="modal" id="myModal">
        <div class="modal-content">
            <!-- 这里替换为你点击后想弹出的图片链接（比如地图定位截图或柴火鸡照片） -->
            <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80" alt="柴火鸡美食">
            <p style="color: #d32f2f; font-weight: bold; margin: 10px 0;">收到！下周见！</p>
            <button class="close-btn" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <!-- 背景音乐 (请将 bgm.mp3 替换为你的音乐文件) -->
    <audio id="bgm" loop>
        <source src="./bgm.mp3" type="audio/mpeg">
        您的浏览器不支持音频元素。
    </audio>

    <script>
        // 弹窗逻辑
        function showLink() {
            document.getElementById('myModal').style.display = 'flex';
            // 尝试播放音乐
            var audio = document.getElementById('bgm');
            audio.play().catch(function(error) {
                console.log("浏览器阻止了自动播放，需要用户交互。");
            });
        }

        function closeModal() {
            document.getElementById('myModal').style.display = 'none';
        }

        // 点击任意位置尝试播放音乐（解决部分浏览器自动播放限制）
        document.body.addEventListener('click', function() {
            var audio = document.getElementById('bgm');
            if (audio.paused) {
                audio.play();
            }
        }, { once: true });

        // 生成飘落爱心背景
        function createSnowflake() {
            const snowContainer = document.getElementById('snow-container');
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.innerHTML = '❤';
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.animationDuration = Math.random() * 3 + 3 + 's';
            snowflake.style.fontSize = Math.random() * 20 + 10 + 'px';
            snowContainer.appendChild(snowflake);
            
            setTimeout(() => {
                snowflake.remove();
            }, 6000);
        }
        setInterval(createSnowflake, 300);
    </script>
</body>
</html>
